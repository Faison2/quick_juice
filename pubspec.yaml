name: jucie_up
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.16.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generates Android and iOS launcher icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/launcher/launcher.png


# ---------------------------------------------------------
# APP LAUNCHER ICON
# ---------------------------------------------------------

flutter_launcher_icons:
  android: true
  ios: true

  # Main launcher icon
  image_path: "assets/launcher/launcher.png"

  # Android adaptive icon
  adaptive_icon_background: "#168DE2"
  adaptive_icon_foreground: "assets/launcher/launcher.png"

  # Keep the generated icons clean
  remove_alpha_ios: true